    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4c99b"/><stop offset=".45" stop-color="#b9945e"/><stop offset="1" stop-color="#ead6af"/></linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b64e5b"/><stop offset="1" stop-color="#803a4b"/></linearGradient>
